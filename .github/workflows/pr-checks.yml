name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Run unit tests
        run: npm test
      - name: Upload Playwright snapshots
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/e2e/web/rendering.spec.ts-snapshots/
