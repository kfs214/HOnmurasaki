version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx expo install --check
    build:
      commands:
        - npm run lint
        - npm run format
        - npx expo export --platform web
    postBuild:
      commands:
        - npx playwright install --with-deps
        - npm run test
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - dist/**/*
